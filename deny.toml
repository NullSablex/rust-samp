# Policy checked by `cargo deny check` (and in CI).
#
# The published crates are MIT. Everything that ships with them has to allow
# that: the list below is what the dependency graph holds today, all of it
# permissive. A dependency under anything else — a copyleft license, or none —
# fails the check instead of arriving unnoticed with an update.

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # webpki-root-certs, reached only through the examples' HTTP client.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# The examples are not published (`publish = false`) and carry no license.
[licenses.private]
ignore = true

[advisories]
# RustSec, the same database `cargo audit` reads.
yanked = "deny"

[bans]
# Two versions of one crate are common in a graph this size and not a defect;
# reported, not failed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
