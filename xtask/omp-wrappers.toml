# Interfaces `cargo xtask gen-omp` wraps, one module each under
# `crates/samp-sdk/src/omp/generated/`.
#
#   class   the interface whose methods are wrapped, with its primary bases
#   header  the SDK header declaring it
#   handle  the Rust handle the wrappers take — the interface itself, or the
#           concrete entity when the interface is a shared base
#   prefix  the functions' prefix: `object` gives `object_set_model`
#   module  the generated file's name
#   this    optional name for the handle argument (defaults to `prefix`)
#   overloads  optional: `method(ParamTypes)` -> the name each overload is
#           wrapped under, spacing removed as in `key_of`. An overload left out
#           is skipped; one listed is checked like any other slot, and on Linux
#           by its parameter list as well as its name
#   impl    the class implementing it in the official server binaries, and
#   library the binary holding it (`Objects` for components/Objects.so|.dll,
#           `omp-server` for the server itself); `cargo xtask
#           check-abi --generated` reads the real vtable there


[[interface]]
class = "IPlayer"
header = "player.hpp"
handle = "IPlayer"
prefix = "player"
module = "player"
this = "player"
impl = "Player"
library = "omp-server"
overloads = { "attachCameraToObject(IObject&)" = "attach_camera_to_object", "attachCameraToObject(IPlayerObject&)" = "attach_camera_to_player_object" }

