[project]
site_name = "rust-samp"
site_url = "https://rust-samp.nullsablex.com/"
site_description = "Complete guide to building SA-MP and Open Multiplayer plugins with Rust"
site_author = "NullSablex"
repo_name = "NullSablex/rust-samp"
repo_url = "https://github.com/NullSablex/rust-samp"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Setup and Installation" = "setup.md" },
    { "Your First Plugin" = "first-plugin.md" },
  ] },
  { "Concepts" = [
    { "Anatomy of a Plugin" = "plugin-anatomy.md" },
    { "Open Multiplayer Support" = "omp-native.md" },
    { "Talking to the Server Directly" = "omp-interfaces.md" },
    { "Native Functions" = "natives.md" },
    { "Events (Callbacks)" = "events.md" },
    { "The Amx Type" = "amx-types.md" },
    { "Calling Pawn from Rust" = "exec-public.md" },
    { "Background Work and the Main Thread" = "threads.md" },
  ] },
  { "Working with Data" = [
    { "Cells and Memory" = "cells-and-memory.md" },
    { "String Encoding" = "encoding.md" },
    { "Error Handling" = "error-handling.md" },
  ] },
  { "Development" = [
    { "Logging and Debug" = "logging.md" },
    { "VM Debugging" = "vm-debugging.md" },
    { "Diagnostics" = "diagnostics.md" },
    { "Build Scripts" = "build-scripts.md" },
    { "Advanced Examples" = "advanced-examples.md" },
  ] },
  { "Reference" = [
    { "Migration Guide" = "migration.md" },
    { "API Reference" = "api-reference.md" },
  ] },
  { "Internals" = [
    { "Open Multiplayer ABI" = "internals/omp-abi.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.tracking",
  "navigation.indexes",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.action.edit",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Light theme"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
permalink_title = "Permanent link"
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
