version: 2

# One entry per area, so each update PR only touches (and only triggers the CI
# checks of) its own area: the SDK workspace, the xtask tooling, the fuzz
# harness, the workflows and the documentation generator.
#
# Cargo entries allow `all` dependency types: most of what the lockfiles pin
# arrives transitively, and without this a patched transitive crate never shows
# up until `cargo audit` fails an unrelated pull request.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    allow:
      - dependency-type: all
    groups:
      sdk:
        patterns: ["*"]
        update-types: [minor, patch]
      sdk-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /xtask
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps-xtask)
    allow:
      - dependency-type: all
    groups:
      xtask:
        patterns: ["*"]
        update-types: [minor, patch]
      xtask-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps-fuzz)
    groups:
      fuzz:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: docs(deps)

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(toolchain)
